name: test-alarm

# Manual end-to-end check of the alarm channel: opens a clearly-labelled test
# issue, then closes it. Run it any time you want to confirm that alarms can
# still reach you — that GITHUB_TOKEN has issues:write, that the label exists,
# and that the open/comment/close path works.
#
# It never touches data files and costs no API credits. The issue is titled
# "[test]" so it is obviously not a real alarm.

on:
  workflow_dispatch:
    inputs:
      leave_open:
        description: "Open the test issue and leave it open (skip the close)"
        type: boolean
        default: false

concurrency:
  group: test-alarm
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to 26 on 2026-10-19, mid-season
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Fire a test alarm
        id: fire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          cat > "$RUNNER_TEMP/firing.json" <<'JSON'
          [{"label": "alarm:test",
            "title": "[test] alarm channel check — safe to close",
            "body": "This is a test of the alarm router, not a real alarm.\n\n**Did this reach your phone?** That is the thing being tested. An earlier version created the issue perfectly and still sent no push, because nobody was assigned and nobody was @mentioned — so the run now fails unless both are true.\n\nIf no notification arrived even though you are assigned and mentioned above, the problem is in your GitHub notification settings rather than this pipeline: check Watching for the repo, and Notifications > Assigned/Mentions on mobile.\n\nThe same run closes it again unless `leave_open` was set.",
            "state": "firing", "throttle_hours": 0, "auto_close": true}]
          JSON
          python3 scripts/alarm.py --from-file "$RUNNER_TEMP/firing.json"

      # Poll THE SPECIFIC ISSUE, not `gh issue list`. GitHub's issue search index
      # lags a write by a second or more: a previous version of this check read
      # "0 open issues" 0.87s after successfully creating one and declared the
      # alarm channel broken. `gh issue view N` reads the object directly.
      - name: Confirm the issue is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.fire.outputs.issue_number }}
        run: |
          if [ -z "$N" ]; then
            echo "::error::the router did not report an issue number — it never created one"
            exit 1
          fi
          echo "polling issue #$N for state=OPEN"
          for i in $(seq 1 20); do
            STATE=$(gh issue view "$N" --json state --jq .state 2>/dev/null || echo "")
            echo "  attempt $i: state=${STATE:-<unreadable>}"
            if [ "$STATE" = "OPEN" ]; then
              break
            fi
            sleep 0.5
          done
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::issue #$N is not OPEN after ~10s — the alarm channel is BROKEN"
            exit 1
          fi
          # An issue nobody is assigned to and nobody is mentioned in sends no push,
          # which is the failure this test exists to catch.
          ASSIGNED=$(gh issue view "$N" --json assignees --jq '[.assignees[].login]|length')
          MENTIONED=$(gh issue view "$N" --json body --jq 'if (.body|test("@${{ github.repository_owner }}")) then 1 else 0 end')
          echo "assignees=$ASSIGNED mentions=$MENTIONED"
          if [ "$ASSIGNED" -lt 1 ] || [ "$MENTIONED" -lt 1 ]; then
            echo "::error::issue #$N has assignees=$ASSIGNED mentions=$MENTIONED — it would NOT have notified you"
            exit 1
          fi
          echo "#$N is open, assigned and @mentioned — this would have pushed"

      - name: Clear it again
        if: github.event.inputs.leave_open != 'true'
        id: clear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_ASSIGNEE: ${{ github.repository_owner }}
          N: ${{ steps.fire.outputs.issue_number }}
        run: |
          cat > "$RUNNER_TEMP/clear.json" <<'JSON'
          [{"label": "alarm:test",
            "title": "[test] alarm channel check — safe to close",
            "body": "Test complete. The alarm channel works end to end.",
            "state": "clear", "throttle_hours": 0, "auto_close": true}]
          JSON
          python3 scripts/alarm.py --from-file "$RUNNER_TEMP/clear.json"
          echo "polling issue #$N for state=CLOSED"
          for i in $(seq 1 20); do
            STATE=$(gh issue view "$N" --json state --jq .state 2>/dev/null || echo "")
            echo "  attempt $i: state=${STATE:-<unreadable>}"
            if [ "$STATE" = "CLOSED" ]; then
              break
            fi
            sleep 0.5
          done
          if [ "$STATE" != "CLOSED" ]; then
            echo "::error::issue #$N is still $STATE after ~10s — auto-close is BROKEN"
            exit 1
          fi
          echo "#$N closed — full open/notify/close cycle verified"
