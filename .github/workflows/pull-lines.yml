name: pull-lines

# Keeps data/nfl.json fresh so a plain Claude.ai chat can fetch it by raw URL.
#
# --merge means every run patches only the markets it pulled into the existing
# file; the others keep their last value and *_at stamp. So one file holds all
# three markets at their own cadences:
#   * scheduled 1x/day  -> ml + spread   (2 credits/run, ~60/month)
#   * manual "Run workflow" with markets=total (or ml / spread / all) -> on demand
#
# Cost = 1 credit per market. The local .usage.json limiter does NOT persist
# between CI runs, so the cron line + the markets choice are the real budget.
# Over the 500/month cap the API just 401s until the 1st — never a charge.

on:
  schedule:
    # Two entries, same time, split by day so the step can vary the markets:
    # github.event.schedule carries the cron string that fired.
    - cron: "0 13 * * 2"            # Tue -> the OPENER: all 3 markets (3 credits)
    - cron: "0 13 * * 0,1,3,4,5,6"  # other days -> drift: ml + spread (2 credits)
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to pull (1 credit each; patched into the existing file)"
        type: choice
        default: "total"
        options:
          - "total"
          - "ml"
          - "spread"
          - "ml,spread"
          - "all"

concurrency:
  group: odds-data              # shared with snipe-closes / pull-rosters: they all
  cancel-in-progress: false     # push to main, so queue rather than race

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # The credit guard was inert in CI for its whole life: Usage read a
      # gitignored file, so every run started at zero and check() never fired.
      # It now reads the committed data/usage.json; this proves it still blocks.
      - name: Verify the credit limiter blocks
        run: python fetch_lines.py --self-test-limiter

      - name: Pull NFL lines
        id: pull
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # A manual run uses its input. A scheduled run picks by which cron fired:
          # Tuesday is the opener and takes totals too, the rest are drift pulls.
          MARKETS: >-
            ${{ github.event.inputs.markets
                || (github.event.schedule == '0 13 * * 2' && 'all')
                || 'ml,spread' }}
        run: |
          python fetch_lines.py --sport nfl --days 12 --drop-empty --merge \
            --markets "$MARKETS" --out data/nfl.json --no-render --force

      # Gated on the pull actually happening. A run that made no API call — the
      # limiter refusing it, --status, --self-test-limiter — cannot reach `git add`
      # at all, on top of having written nothing.
      - name: Commit if changed
        if: steps.pull.outputs.pulled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.json data/usage.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: refresh NFL lines — $MARKETS ($(date -u +%FT%TZ))"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1
        env:
          MARKETS: >-
            ${{ github.event.inputs.markets
                || (github.event.schedule == '0 13 * * 2' && 'all')
                || 'ml,spread' }}

      - name: Note a skipped pull
        if: steps.pull.outputs.pulled != 'true'
        run: echo "no API call was made — nothing written, nothing committed"
