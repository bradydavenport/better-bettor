name: pull-lines

# Keeps data/nfl.json fresh so a plain Claude.ai chat can fetch it by raw URL.
#
# --merge means every run patches only the markets it pulled into the existing
# file; the others keep their last value and *_at stamp. So one file holds all
# three markets at their own cadences:
#   * scheduled 1x/day  -> ml + spread   (2 credits/run, ~60/month)
#   * manual "Run workflow" with markets=total (or ml / spread / all) -> on demand
#
# Cost = 1 credit per market. Over the 500/month cap the API just 401s until the
# 1st — never a charge.
#
# TRIGGERING: the external cron-job.org doorbell dispatches this daily at 13:07
# UTC, because this repo honours its `schedule` crons roughly 4% of the time and
# ran 3-7h late every day it did. The cron below is retained purely as a backup;
# scripts/plan_pull.py skips a run whose work was already done, so the two
# triggers cannot double-spend credits on the same day.

on:
  schedule:
    # Backup only — the doorbell is the primary trigger. One entry now: market
    # selection reads the UTC day of week, not which cron fired.
    # :07, not :00 — off the top of the hour so this does not compete with the
    # sniper's */15 ticks for a runner slot.
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to pull — 'auto' decides by UTC day of week (Tue = all 3)"
        type: choice
        default: "auto"
        options:
          - "auto"
          - "total"
          - "ml"
          - "spread"
          - "ml,spread"
          - "all"

concurrency:
  # Per-workflow, NOT shared. A shared group only allows one pending run, so a
  # */15 sniper queueing behind this would cancel a pending daily pull outright —
  # silently, as a cancellation rather than a failure. Push contention is handled
  # by the replay loop in the commit step, which is where it belongs.
  group: pull-lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to 26 on 2026-10-19, mid-season
    permissions:
      contents: write
      issues: write               # coverage alarms open/close issues
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Decides markets by UTC DAY OF WEEK, not by github.event.schedule, which
      # is empty on workflow_dispatch and would have silently dropped Tuesday's
      # totals the moment the doorbell took over. Also guards against the
      # doorbell and the backup cron both firing on the same day.
      - name: Plan the pull
        id: plan
        env:
          MARKETS_OVERRIDE: ${{ github.event.inputs.markets }}
        run: python3 scripts/plan_pull.py --nfl data/nfl.json

      - name: Note the ledger size before the pull
        if: steps.plan.outputs.skip != 'true' 
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          stat -c%s data/history.jsonl 2>/dev/null > "$RUNNER_TEMP/out/offset" \
            || echo 0 > "$RUNNER_TEMP/out/offset"

      # The credit guard was inert in CI for its whole life: Usage read a
      # gitignored file, so every run started at zero and check() never fired.
      # It now reads the committed data/usage.json; this proves it still blocks.
      - name: Verify the credit limiter blocks
        if: steps.plan.outputs.skip != 'true'
        run: python fetch_lines.py --self-test-limiter

      - name: Pull NFL lines
        id: pull
        if: steps.plan.outputs.skip != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MARKETS: ${{ steps.plan.outputs.markets }}
        run: |
          python fetch_lines.py --sport nfl --days 12 --drop-empty --merge \
            --markets "$MARKETS" --out data/nfl.json --no-render --force \
            --writer pull-lines --alarms-out "$RUNNER_TEMP/pull-alarms.json"

      - name: Route coverage alarms to issues
        if: steps.pull.outputs.pulled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_ASSIGNEE: ${{ github.repository_owner }}
        run: python3 scripts/alarm.py --from-file "$RUNNER_TEMP/pull-alarms.json"

      # Captured to $RUNNER_TEMP, which `git reset --hard` cannot touch.
      - name: Capture this run's outputs
        if: steps.pull.outputs.pulled == 'true'
        run: |
          BEFORE=$(cat "$RUNNER_TEMP/out/offset")
          tail -c +$((BEFORE + 1)) data/history.jsonl > "$RUNNER_TEMP/out/new_rows.jsonl"
          cp data/nfl.json data/usage.json "$RUNNER_TEMP/out/"
          echo "captured $(wc -l < "$RUNNER_TEMP/out/new_rows.jsonl") new ledger rows"

      # Before any push attempt, so a total push failure is still recoverable.
      - name: Upload outputs as an artifact
        if: steps.pull.outputs.pulled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pull-lines-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 30

      # Gated on the pull actually happening. A run that made no API call — the
      # limiter refusing it, --status, --self-test-limiter — cannot reach `git add`
      # at all, on top of having written nothing.
      - name: Commit if changed
        if: steps.pull.outputs.pulled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.json data/usage.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: refresh NFL lines — $MARKETS ($(date -u +%FT%TZ))"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push $attempt rejected"
            [ "$attempt" = 3 ] && break
            git fetch origin
            # The push may have LANDED and only reported failure.
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "our commit is already on origin — the push did land"
              exit 0
            fi
            git reset --hard origin/main
            python3 scripts/replay_outputs.py \
              --rows "$RUNNER_TEMP/out/new_rows.jsonl" \
              --nfl  "$RUNNER_TEMP/out/nfl.json" \
              --usage "$RUNNER_TEMP/out/usage.json"
            git add data/nfl.json data/usage.json data/history.jsonl
            git diff --cached --quiet || git commit -m "data: refresh NFL lines — $MARKETS (replay $attempt)"
          done
          exit 1
        env:
          MARKETS: ${{ steps.plan.outputs.markets }}

      - name: Note a skipped pull
        if: steps.pull.outputs.pulled != 'true'
        run: |
          if [ "${{ steps.plan.outputs.skip }}" = "true" ]; then
            echo "skipped by the recency guard — pull-lines already pulled today"
          else
            echo "no API call was made — nothing written, nothing committed"
          fi
