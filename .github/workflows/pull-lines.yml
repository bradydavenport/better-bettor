name: pull-lines

# Refreshes data/nfl.json on a schedule so a plain Claude.ai chat can fetch it
# by raw URL. Also runnable on demand from the Actions tab ("Run workflow") or
# `gh workflow run pull-lines.yml`.
#
# Budget: cost = 1 credit per market. This run pulls ml + spread = 2 credits;
# totals are left for manual pulls. The cron frequency IS the budget here — the
# local .usage.json limiter does not persist between CI runs, so keep it sane.
#   1x/day x 2 markets (current) ≈ 60/month, leaving ~440 for manual + local
#   "0 13 * * *" -> daily 13:00 UTC   "0 */12 * * *" -> 2x/day   "0 */6 * * *" -> 4x/day
# Going over the 500 cap is not billed; the API just 401s until the 1st.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: pull-lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Pull NFL lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python fetch_lines.py --sport nfl --days 12 --drop-empty --markets ml,spread \
            --out data/nfl.json --no-render --force

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.json data/usage.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh NFL lines ($(date -u +%FT%TZ))"
            git push
          fi
