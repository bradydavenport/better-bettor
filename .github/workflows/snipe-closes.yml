name: snipe-closes

# Captures the CLOSING line: a pull ~45 minutes before kickoff, never after.
# An in-play line is not a close, so the gate refuses to pull once a game starts.
#
# Runs every 15 minutes all week and lets the gate decide, rather than hand-writing
# crons per game window. That is cheaper and more correct:
#   * the schedule comes from the free /events endpoint, so flex scheduling,
#     international kickoffs and holiday slates need no special casing. An earlier
#     draft of this file used nine hand-built crons and still missed Christmas
#     (Fri Dec 25 2026 kicks off ~01:15 UTC Saturday under EST).
#   * a no-op run costs 0 credits, writes nothing and commits nothing.
#   * the repo is public, so Actions minutes are free and unmetered.
#
# Cost: /events does not count against the usage quota (docs, and verified:
# x-requests-last: 0). ~2,900 gate calls/month; no rate limit is documented and a
# 20-call burst in 3.9s passed cleanly, but the gate treats HTTP 429 as "closed"
# so an undocumented cap degrades safely instead of breaking.
#
# Credits actually spent: ~15/week normally (TNF, two Sunday slates, SNF, MNF at
# 3 credits each), ~30/week worst case (Thanksgiving's three windows + Black
# Friday + a Saturday slate + an international kickoff + both Sunday slates +
# SNF + MNF). The monthly cap is 500.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Minutes before kickoff that open the gate (default 45)"
        type: string
        required: false
      dry_run:
        description: "Evaluate the gate and stop, without pulling"
        type: boolean
        default: false
      test_mode:
        description: "REHEARSAL: scratch snipe state, writer=snipe-test, never marks a real close"
        type: boolean
        default: false
      no_poll:
        description: "Evaluate once and exit instead of staying alive to poll"
        type: boolean
        default: false

concurrency:
  # Per-workflow, NOT shared with pull-lines. Only one run may be pending per
  # group, so a */15 cron sharing a group with the daily pull would cancel that
  # pull's pending run — and a cancellation is silent, not a red failure. Push
  # contention is handled by the replay loop below instead.
  group: snipe-closes
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to 26 on 2026-10-19, mid-season
    permissions:
      contents: write
      issues: write               # alarms are routed to issues, not annotations
    steps:
      - uses: actions/checkout@v7

      # Installed up front rather than lazily. Any loop iteration may pull, and a
      # dependency failure discovered five hours in, forty minutes before kickoff,
      # is the worst possible moment to find out.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ONE long-lived job does the timing itself. The external cron-job.org
      # doorbell only has to land a single dispatch anywhere in the 5.5h before
      # kickoff; this loop covers the rest. That matters because this repo honours
      # its `schedule` crons about 4% of the time — measured: 8 runs in 48h
      # against 192 due, and a 3h23m gap swallowed the whole MNF window.
      #
      # The gate never sleeps. It answers "pull now?" and "worth waiting?", and
      # THIS loop sleeps, so the timing stays unit-testable and a wedged poll
      # cannot hide inside Python.
      - name: Snipe closes (poll until the last kickoff or 5.5h)
        id: snipe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_ASSIGNEE: ${{ github.repository_owner }}
          WINDOW: ${{ github.event.inputs.window }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          NO_POLL: ${{ github.event.inputs.no_poll }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"

          # 5.5h, comfortably inside GitHub's 6h job cap with room to finish a
          # pull, a commit and a push on the way out.
          DEADLINE=$(( $(date -u +%s) + 330 * 60 ))

          WRITER=snipe-closes
          STATE=data/sniped.json
          STATE_REF_ARGS=(--state-ref "origin/main:data/sniped.json")
          if [ "$TEST_MODE" = "true" ]; then
            # Rehearsal: scratch state seeded from the real file, so the gate sees
            # real snipes but can never write one. History rows are tagged so they
            # can never be graded as a close.
            WRITER=snipe-test
            STATE="$RUNNER_TEMP/out/sniped-scratch.json"
            cp data/sniped.json "$STATE" 2>/dev/null || echo '{"sniped":{},"missed":{}}' > "$STATE"
            STATE_REF_ARGS=()
            echo "::notice::TEST MODE — scratch state at $STATE, writer=$WRITER, real data/sniped.json untouched"
          fi

          PULLS=0
          while :; do
            NOW=$(date -u +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "reached the 5.5h poll deadline; exiting cleanly"
              break
            fi

            : > "$RUNNER_TEMP/gate.out"
            GATE_ARGS=(--state "$STATE" --alarms-out "$RUNNER_TEMP/gate-alarms.json"
                       --heartbeat-repo "$REPO" --heartbeat-exclude-run "$RUN_ID"
                       "${STATE_REF_ARGS[@]}")
            if [ -n "$WINDOW" ]; then
              GATE_ARGS+=(--window "$WINDOW")
            fi
            GITHUB_OUTPUT="$RUNNER_TEMP/gate.out" python3 scripts/close_gate.py "${GATE_ARGS[@]}"
            PULL=$(sed -n 's/^pull=//p'         "$RUNNER_TEMP/gate.out" | tail -1)
            KEEP=$(sed -n 's/^keep_polling=//p' "$RUNNER_TEMP/gate.out" | tail -1)
            HORIZON=$(sed -n 's/^horizon=//p'   "$RUNNER_TEMP/gate.out" | tail -1)
            COUNT=$(sed -n 's/^game_count=//p'  "$RUNNER_TEMP/gate.out" | tail -1)

            python3 scripts/alarm.py --from-file "$RUNNER_TEMP/gate-alarms.json" || true

            # A newly reported missed close is real output even on a no-pull run.
            if [ "$TEST_MODE" != "true" ] && ! git diff --quiet -- data/sniped.json; then
              git add data/sniped.json
              git commit -q -m "data: record reported missed close(s)"
              bash scripts/push_with_replay.sh "data: record reported missed close(s)" || echo "::warning::could not push missed-close record"
            fi

            if [ "$PULL" = "true" ] && [ "$DRY_RUN" != "true" ]; then
              echo "::group::pull $((PULLS + 1)) — $COUNT game(s) through $HORIZON"
              BEFORE=$(stat -c%s data/history.jsonl 2>/dev/null || echo 0)
              python3 fetch_lines.py --sport nfl --days 12 --drop-empty --merge \
                --markets all --out data/nfl.json --no-render --force \
                --writer "$WRITER" --alarms-out "$RUNNER_TEMP/pull-alarms.json"
              tail -c +$((BEFORE + 1)) data/history.jsonl > "$RUNNER_TEMP/out/new_rows.jsonl"
              cp data/nfl.json data/usage.json "$RUNNER_TEMP/out/"
              python3 scripts/alarm.py --from-file "$RUNNER_TEMP/pull-alarms.json" || true

              python3 scripts/close_gate.py --mark --state "$STATE" \
                --horizon "$HORIZON" --ids-out "$RUNNER_TEMP/out/sniped_ids.json" \
                --no-deadman

              if [ "$TEST_MODE" = "true" ]; then
                # Never commit a rehearsal's snipe marks. Ledger rows are already
                # tagged writer=snipe-test, so they are safe to keep.
                git add data/nfl.json data/usage.json data/history.jsonl
                git commit -q -m "data: snipe-test rehearsal pull (not a close)"
              else
                git add data/nfl.json data/usage.json data/history.jsonl data/sniped.json
                git commit -q -m "data: close snipe — $COUNT game(s) @ $HORIZON"
              fi
              bash scripts/push_with_replay.sh "data: close snipe — $COUNT game(s) @ $HORIZON"
              PULLS=$((PULLS + 1))
              echo "::endgroup::"
            fi

            if [ "$NO_POLL" = "true" ] || [ "$DRY_RUN" = "true" ]; then
              echo "single-shot mode; exiting"
              break
            fi
            if [ "$KEEP" != "true" ]; then
              echo "nothing else within the lookahead; exiting"
              break
            fi
            sleep 60
          done
          echo "pulls=$PULLS" >> "$GITHUB_OUTPUT"
          echo "completed with $PULLS pull(s)"

      - name: Prove the rehearsal left the real snipe state alone
        if: github.event.inputs.test_mode == 'true'
        run: |
          if git diff --quiet HEAD -- data/sniped.json && \
             git diff --quiet origin/main -- data/sniped.json; then
            echo "data/sniped.json is untouched, as a rehearsal requires"
          else
            echo "::error::TEST MODE modified data/sniped.json — a rehearsal must never mark a real close"
            git --no-pager diff origin/main -- data/sniped.json | head -40
            exit 1
          fi

      - name: Upload this run's outputs
        if: always() && hashFiles(format('{0}/out/new_rows.jsonl', runner.temp)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: snipe-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 30
