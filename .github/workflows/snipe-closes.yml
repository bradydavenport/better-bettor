name: snipe-closes

# Captures the CLOSING line: a pull ~45 minutes before kickoff, never after.
# An in-play line is not a close, so the gate refuses to pull once a game starts.
#
# Runs every 15 minutes all week and lets the gate decide, rather than hand-writing
# crons per game window. That is cheaper and more correct:
#   * the schedule comes from the free /events endpoint, so flex scheduling,
#     international kickoffs and holiday slates need no special casing. An earlier
#     draft of this file used nine hand-built crons and still missed Christmas
#     (Fri Dec 25 2026 kicks off ~01:15 UTC Saturday under EST).
#   * a no-op run costs 0 credits, writes nothing and commits nothing.
#   * the repo is public, so Actions minutes are free and unmetered.
#
# Cost: /events does not count against the usage quota (docs, and verified:
# x-requests-last: 0). ~2,900 gate calls/month; no rate limit is documented and a
# 20-call burst in 3.9s passed cleanly, but the gate treats HTTP 429 as "closed"
# so an undocumented cap degrades safely instead of breaking.
#
# Credits actually spent: ~15/week normally (TNF, two Sunday slates, SNF, MNF at
# 3 credits each), ~30/week worst case (Thanksgiving's three windows + Black
# Friday + a Saturday slate + an international kickoff + both Sunday slates +
# SNF + MNF). The monthly cap is 500.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Minutes before kickoff that open the gate (default 45)"
        type: string
        required: false
      dry_run:
        description: "Evaluate the gate and stop, without pulling"
        type: boolean
        default: false

concurrency:
  # Per-workflow, NOT shared with pull-lines. Only one run may be pending per
  # group, so a */15 cron sharing a group with the daily pull would cancel that
  # pull's pending run — and a cancellation is silent, not a red failure. Push
  # contention is handled by the replay loop below instead.
  group: snipe-closes
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write               # alarms are routed to issues, not annotations
    steps:
      - uses: actions/checkout@v4

      # The gate is the only step ~99% of runs execute, so it deliberately avoids
      # setup-python and pip: stdlib-only, on the runner's preinstalled python3.
      - name: Is a close imminent?
        id: gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WINDOW: ${{ github.event.inputs.window }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ARGS=(--state data/sniped.json --alarms-out "$RUNNER_TEMP/gate-alarms.json")
          if [ -n "$WINDOW" ]; then
            ARGS+=(--window "$WINDOW")
          fi
          python3 scripts/close_gate.py "${ARGS[@]}"

      # Runs on EVERY gate tick, including the ~99% that do nothing else: the
      # dead-man's switch and missed-close alarms only exist on this path.
      - name: Route gate alarms to issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/alarm.py --from-file "$RUNNER_TEMP/gate-alarms.json"

      # The gate writes sniped.json when it reports a newly missed close, so that
      # miss is never reported twice. That is real output on an otherwise no-op
      # run, so it needs committing even though no pull happened.
      - name: Commit reported misses
        if: steps.gate.outputs.missed_recorded == 'true' && steps.gate.outputs.pull != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sniped.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: record reported missed close(s)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            [ "$attempt" = 3 ] && break
            git fetch origin
            if git merge-base --is-ancestor HEAD origin/main; then exit 0; fi
            # Re-deriving is free: re-run the gate against the new origin state.
            git reset --hard origin/main
            python3 scripts/close_gate.py --state data/sniped.json --no-deadman
            git add data/sniped.json
            git diff --cached --quiet && exit 0
            git commit -m "data: record reported missed close(s) (replay $attempt)"
          done
          exit 1

      - name: Install dependencies
        if: steps.gate.outputs.pull == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip install
        if: steps.gate.outputs.pull == 'true' && github.event.inputs.dry_run != 'true'
        run: pip install -r requirements.txt

      - name: Note the ledger size before the pull
        if: steps.gate.outputs.pull == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          stat -c%s data/history.jsonl 2>/dev/null > "$RUNNER_TEMP/out/offset" \
            || echo 0 > "$RUNNER_TEMP/out/offset"

      # --force dips into the daily soft limit on purpose: a close cannot be
      # re-pulled later. The hard guards (monthly cap, api_remaining) still apply
      # and --force does not override those.
      - name: Pull the close (all 3 markets)
        id: pull
        if: steps.gate.outputs.pull == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python fetch_lines.py --sport nfl --days 12 --drop-empty --merge \
            --markets all --out data/nfl.json --no-render --force \
            --writer snipe-closes --alarms-out "$RUNNER_TEMP/pull-alarms.json"

      - name: Route coverage alarms to issues
        if: steps.pull.outputs.pulled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/alarm.py --from-file "$RUNNER_TEMP/pull-alarms.json"

      # Only after the pull succeeded. Marking first would record a close as
      # captured even when the pull failed, and a missed close is unrecoverable.
      - name: Mark those games sniped
        if: steps.pull.outputs.pulled == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/close_gate.py --mark \
            --state data/sniped.json \
            --horizon "${{ steps.gate.outputs.horizon }}" \
            --ids-out "$RUNNER_TEMP/out/sniped_ids.json"

      # $RUNNER_TEMP survives `git reset --hard`, which the repo tree does not.
      - name: Capture this run's outputs
        if: steps.pull.outputs.pulled == 'true'
        run: |
          BEFORE=$(cat "$RUNNER_TEMP/out/offset")
          tail -c +$((BEFORE + 1)) data/history.jsonl > "$RUNNER_TEMP/out/new_rows.jsonl"
          cp data/nfl.json data/usage.json "$RUNNER_TEMP/out/"
          echo "captured $(wc -l < "$RUNNER_TEMP/out/new_rows.jsonl") new ledger rows"

      # Uploaded BEFORE any push attempt: 3 credits and a closing line are already
      # spent by this point, so a total push failure must still be recoverable.
      - name: Upload outputs as an artifact
        if: steps.pull.outputs.pulled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snipe-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 30

      - name: Commit
        if: steps.pull.outputs.pulled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.json data/usage.json data/history.jsonl data/sniped.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          MSG="data: close snipe — ${{ steps.gate.outputs.game_count }} game(s) @ ${{ steps.gate.outputs.horizon }}"
          git commit -m "$MSG"
          # Push, then REPLAY onto whatever origin now holds. Not a rebase: only
          # history.jsonl has a merge driver, so rebasing conflicts on nfl.json and
          # sniped.json. reset-plus-replay cannot conflict at all.
          # 3 pushes, 2 replays — no replay after the final attempt.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push $attempt rejected"
            [ "$attempt" = 3 ] && break
            git fetch origin
            # The push may have LANDED and only reported failure.
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "our commit is already on origin — the push did land"
              exit 0
            fi
            git reset --hard origin/main
            python3 scripts/replay_outputs.py \
              --rows  "$RUNNER_TEMP/out/new_rows.jsonl" \
              --ids   "$RUNNER_TEMP/out/sniped_ids.json" \
              --nfl   "$RUNNER_TEMP/out/nfl.json" \
              --usage "$RUNNER_TEMP/out/usage.json"
            git add data/nfl.json data/usage.json data/history.jsonl data/sniped.json
            git diff --cached --quiet || git commit -m "$MSG (replay $attempt)"
          done
          exit 1
